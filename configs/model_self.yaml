# YOLOv11n + VMamba + MCS_AFF + RRAM (基于你的真实路径和网络拓扑)
nc: 5
scales: 
  n: [0.50, 0.25, 1024] 

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5
  
  # 🔥 创新点 1：用 Mamba 替换 C3k2，提取长距离全局共现特征 (服务于后续的 RRAM)
  - [-1, 2, VSSBlock, [512]] # 6 
  
  - [-1, 1, Conv, [1024, 3, 2]] # 7
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head (MCS_AFF 替换 Concat)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  
  # P4 融合
  - [[-1, 6], 1, MCS_AFF, [1]] # 12 
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  
  # P3 融合
  - [[-1, 4], 1, MCS_AFF, [1]] # 15 
  - [-1, 2, C3k2, [256, False]] # 16 (P3 尺度输出 -> 接入 RRAM)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  
  # P4 第二次融合
  - [[-1, 13], 1, MCS_AFF, [1]] # 18 
  - [-1, 2, C3k2, [512, False]] # 19 (P4 尺度输出 -> 接入 RRAM)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  
  # P5 融合
  - [[-1, 10], 1, MCS_AFF, [1]] # 21 
  - [-1, 2, C3k2, [1024, True]] # 22 (P5 尺度输出，不接 RRAM)

  # 🔥 创新点 2 & 3：RRAM (PG-GRAM) 分别对 P3 和 P4 特征进行图先验校准
  - [16, 1, RRAM, [5, 0.0, None, None, "'priors/self/A_hat.npy'", "'priors/self/V.npy'"]] # 23
  - [19, 1, RRAM, [5, 0.0, None, None, "'priors/self/A_hat.npy'", "'priors/self/V.npy'"]] # 24

  # Detect 头 (接收两个被图推理增强的特征，以及一个原始的大尺度特征)
  - [[23, 24, 22], 1, Detect, [nc]]